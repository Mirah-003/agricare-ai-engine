services:
  - type: web
    name: agricare-ai-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AGRICARE_API_KEY
        value: agricare_test_key_123
